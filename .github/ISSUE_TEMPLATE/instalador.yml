# FORMULARIO DE REPORTE DEL INSTALADOR (SC-107). EL INSTALADOR LO ABRE CON
# version, sistema Y paso YA COMPLETADOS POR LA URL (?template=instalador.yml
# &version=…&sistema=…&paso=…): ESOS TRES id NO SE CAMBIAN SIN CAMBIAR
# distribucion/instalador.sh.in. LA ETIQUETA «instalador» SE APLICA SOLO SI
# EXISTE EN EL REPOSITORIO
name: Problema con el instalador
description: El instalador de gbpublisher terminó con un error.
title: "[Instalador] "
labels: ["instalador"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. Si llegó desde el enlace que muestra el instalador, los tres primeros campos ya están completos: no los cambie.

        **Adjunte el registro de la instalación**, el archivo `gbpublisher-instalacion-AAAAMMDD-HHMM.log` de su carpeta personal: arrástrelo al último campo.
  - type: input
    id: version
    attributes:
      label: Versión del instalador
      description: La completa el instalador.
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema
      description: Lo completa el instalador.
    validations:
      required: true
  - type: input
    id: paso
    attributes:
      label: Paso en que falló
      description: Lo completa el instalador.
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasó
      description: Lo que vio en la pantalla, y si volvió a ejecutar el instalador antes de reportarlo.
    validations:
      required: true
  - type: textarea
    id: registro
    attributes:
      label: Registro de la instalación
      description: Arrastre acá el archivo gbpublisher-instalacion-AAAAMMDD-HHMM.log de su carpeta personal.
    validations:
      required: true
