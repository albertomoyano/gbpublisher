# PROVEEDOR LLM DE gbpublisher — UN ARCHIVO POR PROVEEDOR, LEÍDO CON gb.settings.
# Url         : ENDPOINT COMPLETO DE CHAT COMPLETIONS (FORMATO COMPATIBLE CON OpenAI).
# Modelo      : IDENTIFICADOR DEL MODELO SEGÚN LA DOCUMENTACIÓN DEL PROVEEDOR.
# Credencial  : NOMBRE DEL PROVEEDOR EN api_credenciales; VACÍO = NO LLEVA CLAVE.
# Plazo       : SEGUNDOS DE ESPERA ANTES DE ABANDONAR LA CONSULTA.
# Temperatura : 0 PARA RESPUESTAS LO MÁS DETERMINISTAS POSIBLE.
# Busqueda    : True SI EL PROVEEDOR HACE BÚSQUEDA WEB CON CITAS; SOLO ESOS SE OFRECEN EN EL MODO CONSULTAR.
# FUENTE      : console.groq.com/docs/openai y console.groq.com/docs/models

[Proveedor]
Nombre="Groq"
Orden=2
Url="https://api.groq.com/openai/v1/chat/completions"
Modelo="openai/gpt-oss-120b"
Credencial="Groq"
Plazo=60
Temperatura=0
Busqueda=False
