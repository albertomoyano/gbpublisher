% ============================================================
% cita-tex4ht.cfg — CONFIGURACIÓN DE tex4ht PARA LA PASADA DE
%                   CITAS Y REFERENCIAS DE HTML Y EPUB (SC-57)
% ------------------------------------------------------------
% COMÚN A TODOS LOS ESTILOS: SOLO TRADUCE MARCADO Y PREPARA EL
% DOCUMENTO MÍNIMO PARA tex4ht. LO QUE ES DE UN ESTILO VA EN SU
% cita-<estilo>-html.tex.
%
% fn-in: LAS NOTAS EN LA MISMA PÁGINA. SIN ESO, CADA NOTA SALE
% EN UN ARCHIVO APARTE (MEDIDO).
% ============================================================
\Preamble{xhtml,fn-in}

% CURSIVA DE biblatex (\mkbibemph USA \emph) COMO <em>, SIN EL
% <span> CON EL NOMBRE DE LA FUENTE
\Configure{emph}{\HCode{<em>}\NoFonts}{\EndNoFonts\HCode{</em>}}
\Configure{textit}{\HCode{<em>}\NoFonts}{\EndNoFonts\HCode{</em>}}

% NEGRITA: LA DE UN AFIJO DE CITA (emphasis role="strong")
\Configure{textbf}{\HCode{<strong>}\NoFonts}{\EndNoFonts\HCode{</strong>}}

% VERSALITAS (\textsc): EL TEXTO LLEGA CON SU CAJA Y EL CSS LAS
% PONE CON font-variant-caps: all-small-caps (SC-56)
\Configure{textsc}{\HCode{<span class="versalitas-todas">}\NoFonts}{\EndNoFonts\HCode{</span>}}

\begin{document}

% ------------------------------------------------------------
% SIN CORTES DE RENGLÓN
% ------------------------------------------------------------
% tex4ht ESCRIBE CADA CORTE DE RENGLÓN DE TeX COMO UN SALTO DE
% LÍNEA DEL HTML, Y EL NAVEGADOR LO LEE COMO UN ESPACIO. DONDE
% TeX CORTÓ SIN ESPACIO —ANTES DE UNA URL, QUE ADMITE CORTE—
% EL HTML MUESTRA UNO QUE NO EXISTE: «recuperado de < http://…>»
% (MEDIDO CON EL LIBRO DE DUEK: 4 DE 11 URL). CON UN ANCHO QUE
% NINGÚN PÁRRAFO ALCANZA, TeX NO CORTA. 500cm ESTÁ POR DEBAJO
% DEL MÁXIMO DE TeX (\maxdimen, UNOS 575cm).
% ------------------------------------------------------------
\setlength{\textwidth}{500cm}
\setlength{\columnwidth}{500cm}
\setlength{\linewidth}{500cm}
\setlength{\hsize}{500cm}

\makeatletter
% EN babel-spanish < Y > SON ACTIVOS: EL MARCADO QUE SE INSERTA
% DESDE ACÁ VA CON \string. SIN ESO: «Argument of
% \language@active@arg has an extra }» (MEDIDO)

% EL ORDINAL DE babel-spanish (n.º): EL PUNTO Y UN <sup>, EN
% LUGAR DEL \raise DE LA VERSIÓN IMPRESA
\def\es@sptext#1{\es@orddot\HCode{\string<sup\string>}#1\HCode{\string</sup\string>}}

% LA MARCA DE CADA CITA (SC-57): <span id="gbcita-{id}">. EL id
% LO PONE docbook-to-latex-citas.xsl; LAS HOJAS DE HTML Y EPUB
% LO BUSCAN
\renewcommand*{\gbcita}[2]{%
  \HCode{\string<span id="gbcita-#1"\string>}#2\HCode{\string</span\string>}}

% LA MARCA DE CADA BIBLIOGRAFÍA (SC-57): <span id="gbbib-{pieza}">,
% VACÍO, ANTES DE SU LISTA. {pieza} ES sección-orden, O libro PARA LA
% CONSOLIDADA. LAS HOJAS TOMAN LA PRIMERA LISTA QUE LO SIGUE
\renewcommand*{\gbbibliografia}[1]{%
  \HCode{\string<span id="gbbib-#1"\string>\string</span\string>}}

% LAS MACROS EN LÍNEA DEL CONTRATO QUE PUEDEN LLEGAR EN UN AFIJO
% DE CITA. EL DOCUMENTO MÍNIMO NO CARGA EL CONTRATO: SE DEFINEN
% CON SU FORMA HTML, LA MISMA QUE USAN LAS HOJAS (SC-30)
\providecommand*{\gbTachado}[1]{%
  \HCode{\string<del\string>}#1\HCode{\string</del\string>}}
\providecommand*{\gbSubrayado}[1]{%
  \HCode{\string<u\string>}#1\HCode{\string</u\string>}}

% EL CUERPO DE LETRA NO SE TRADUCE: SIN ESTO, CADA CAMBIO DE
% TAMAÑO DA UN <span> CON EL NOMBRE DE LA FUENTE (ec-lmr-9 EN LA
% BIBLIOGRAFÍA, ec-lmr-8 EN LAS NOTAS; MEDIDO). LO MISMO LA
% LETRA DE MÁQUINA DE LAS URL (ec-lmtt-10)
\renewcommand*{\bibfont}{}
\renewcommand*{\footnotesize}{}
\urlstyle{same}
\makeatother

\EndPreamble
